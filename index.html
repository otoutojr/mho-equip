<!doctype html>
<html lang="ja" data-el="無">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>融光工房 ― アウトランダーズ最強装備</title>
<meta name="description" content="冒険ランクを入れるだけで、そのランクで作れるDPS最大の武器・防具を計算するモンハンアウトランダーズ用ツール">
<meta name="theme-color" content="#ece2c9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="融光工房">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/ShipporiMinchoB1-ExtraBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <span class="crest" id="crest" aria-hidden="true"></span>
    <div class="who">
      <p class="brand">融光工房</p>
      <h1 id="whoName">読み込み中…</h1>
      <p class="note" id="whoSub"></p>
    </div>
    <button type="button" class="btn" id="editBtn" aria-expanded="false" aria-controls="picker">変更</button>
  </header>

  <section id="picker" class="card frame" hidden aria-label="キャラとランクを選ぶ">
    <h2 class="hd">キャラ</h2>
    <div class="chips" id="charTabs"></div>
    <div class="pickSub" id="heroSel" hidden>
      <h2 class="hd">武器</h2>
      <div class="chips" id="weaponTabs"></div>
      <h2 class="hd">属性</h2>
      <div class="chips" id="elementTabs"></div>
    </div>
    <h2 class="hd">冒険ランク</h2>
    <div class="rankRow">
      <button type="button" class="nudge" data-nudge="-1" aria-label="ランクを1下げる">−</button>
      <input id="rank" type="range" min="1" max="60" step="1" value="1" aria-label="冒険ランク">
      <button type="button" class="nudge" data-nudge="1" aria-label="ランクを1上げる">＋</button>
      <span class="rankVal" id="rankVal">1</span>
    </div>
    <p class="note" id="capNote"></p>
    <div id="capFix"></div>
    <button type="button" class="btn solid" id="pickDone">決定</button>
  </section>

  <section class="dps card frame" aria-live="polite">
    <div class="dpsHead">
      <p class="lbl">DPS目安</p>
      <div class="seg" id="targetTabs" role="group" aria-label="相手">
        <button type="button" data-target="normal" aria-pressed="true">通常</button><button type="button" data-target="yuko" aria-pressed="false">融光種</button>
      </div>
    </div>
    <div class="dpsRow">
      <p class="dpsNum" id="dpsNum">―</p>
      <span class="stamp" id="elStamp" aria-hidden="true"></span>
    </div>
    <p class="note" id="dpsSub"></p>
  </section>

  <div class="seg wide" role="tablist" aria-label="構成の出し方">
    <button type="button" role="tab" id="tabCalc" aria-selected="true" aria-controls="viewCalc">計算の最強</button>
    <button type="button" role="tab" id="tabDb" aria-selected="false" aria-controls="viewDb">攻略サイトの構成 <span id="dbCount"></span></button>
  </div>

  <section class="view" id="viewCalc" role="tabpanel" aria-labelledby="tabCalc">
    <div class="block">
      <h2 class="hd">スキルの指定</h2>
      <div class="rows card" id="wantList"></div>
      <div class="card" id="wantPicker" hidden>
        <div class="chips" id="wantCats" role="group" aria-label="スキルの種類"></div>
        <div class="rows" id="wantChoices"></div>
      </div>
      <p class="note foot" id="wantNote"></p>
    </div>
    <div class="block">
      <h2 class="hd">装備</h2>
      <div class="rows card" id="gear"></div>
      <p class="note foot" id="resultHint"></p>
    </div>
    <div class="block">
      <h2 class="hd">付くスキル</h2>
      <div class="rows card" id="skillTotals"></div>
      <p class="note foot" id="setNote" hidden></p>
    </div>
    <div class="block">
      <h2 class="hd">強い装備の候補</h2>
      <div class="rows card" id="candList"></div>
    </div>
  </section>

  <section class="view" id="viewDb" role="tabpanel" aria-labelledby="tabDb" hidden>
    <p class="note foot" id="dbHint">読み込み中…</p>
    <ol id="dbList"></ol>
  </section>

  <section class="folds card">
    <details class="fold" id="foldElem" hidden>
      <summary>ほかの属性と比べる</summary>
      <div class="foldBody"><div class="rows" id="elemList"></div></div>
    </details>
    <details class="fold" id="foldCompare">
      <summary>ほかの組み方と比べる</summary>
      <div class="foldBody">
        <div class="block" id="cmpBlock">
          <p class="note">どのスキルを軸にすると一番DPSが出るか。押すと防具が出ます。</p>
          <div class="rows" id="compareList"></div>
        </div>
      </div>
    </details>
    <details class="fold" id="foldNext">
      <summary>次のランクで変わること</summary>
      <div class="foldBody">
        <div class="rows" id="nextList"></div>
        <div class="block" id="goalBody"></div>
      </div>
    </details>
    <details class="fold" id="foldPrio">
      <summary>スキルごとのDPS効果</summary>
      <div class="foldBody">
        <p class="note" id="prioHint"></p>
        <div class="rows" id="prioList"></div>
        <div class="prose" id="sourceList"></div>
      </div>
    </details>
  </section>
</main>

<script src="vendor/number-flow/number-flow.iife.js" defer></script>
<script src="vendor/rough-notation/rough-notation.iife.js" defer></script>
<script src="phrase.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
